version: 2

updates:
  # The pnpm workspace: the root, packages/*, integration and examples/*
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Raise a range only when the new version falls outside it, so the peer ranges of the published packages stay put
    versioning-strategy: increase-if-necessary
    # A new release must be a week old before it is proposed, so a compromised version has time to be caught
    cooldown:
      default-days: 7
    groups:
      # The NestJS packages declare each other as peers of the same major, so they move together
      nestjs:
        patterns:
          - '@nestjs/*'
      # One pull request for all minor and patch updates, so the workspace versions stay aligned (manypkg)
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # A zod major changes the peer range of the published packages, which needs a major release
      - dependency-name: zod
        update-types: ['version-update:semver-major']
      - dependency-name: inversify
        update-types: ['version-update:semver-major']
      # A new kysely minor can break while it is 0.x, and the migrator imports from its kysely/migration subpath
      - dependency-name: kysely
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The TaskQueue interface of loft-llm-call-manager follows the p-queue API, and a new major can change it
      - dependency-name: p-queue
        update-types: ['version-update:semver-major']
      # Peer dependencies of the LLM strategies; a new major (a new minor for the 0.x Anthropic SDK) can need code changes,
      # and a new openai or @google/genai major a wider peer range
      - dependency-name: openai
        update-types: ['version-update:semver-major']
      - dependency-name: '@anthropic-ai/sdk'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@google/genai'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
