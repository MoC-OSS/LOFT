name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Check commit sign-off (DCO)
    # The commits of this private repository were never signed off; the check starts with the public repository
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email=$(git show -s --format='%ae' "$sha")
            # Bot commits, such as the Changesets release pull request, carry no sign-off
            case "$author_email" in *'[bot]@users.noreply.github.com') continue ;; esac
            expected="Signed-off-by: $(git show -s --format='%an <%ae>' "$sha")"
            if ! git show -s --format='%B' "$sha" | grep -qiF "$expected"; then
              echo "::error::Commit $sha ($(git show -s --format='%s' "$sha")) has no '$expected' line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off your commits with 'git rebase --signoff $BASE_SHA' and force-push the branch. See CONTRIBUTING.md."
            exit 1
          fi
