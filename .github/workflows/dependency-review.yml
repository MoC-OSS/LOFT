name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    # Needs the dependency graph, which private repositories get only with GitHub Advanced Security
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      # Fails when a pull request adds a dependency with a known high or critical vulnerability, or a copyleft license
      # that conflicts with MIT
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
