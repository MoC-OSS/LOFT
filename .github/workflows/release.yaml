name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Configure in Settings > Environments: deployments from main only
    environment: npm-release
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the Version Packages pull request
    steps:
      # Keeps the checkout credentials: changesets/action pushes the version branch with `git push origin`
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Never publish what does not build or pass its tests
      - name: Build
        run: pnpm build:all

      - name: Unit tests
        run: pnpm test:unit

      # To be replaced by npm trusted publishing (OIDC)
      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            //registry.npmjs.org/:_authToken=$MOCG_NPMJS_TOKEN
            @moc-global:registry=https://registry.npmjs.org/
            always-auth=true
          EOF
        env:
          MOCG_NPMJS_TOKEN: ${{ secrets.MOCG_NPMJS_TOKEN }}

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.MOCG_NPMJS_TOKEN }}
