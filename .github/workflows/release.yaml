name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Configure in Settings > Environments: deployments from main only
    environment: npm-release
    permissions:
      contents: write # push the version commit and tags
      pull-requests: write # open the Version Packages pull request
      id-token: write # npm trusted publishing (OIDC)
    steps:
      # Keeps the checkout credentials: changesets/action pushes the version branch with `git push origin`
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node.js 24 ships npm 11, and npm trusted publishing needs npm 11.5.1 or later:
      # changeset publish runs pnpm publish, which hands the packed tarball to npm publish
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Never publish what does not build or pass its tests
      - name: Build
        run: pnpm build:all

      - name: Unit tests
        run: pnpm test:unit

      # npm trusted publishing (OIDC): with no NPM_TOKEN set, changesets/action leaves ~/.npmrc alone
      # and npm exchanges the job's OIDC token for a short-lived publish token. npm adds provenance itself.
      # Each package needs a trusted publisher on npmjs.com for MoC-OSS/LOFT, release.yaml, environment npm-release.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run publish-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
