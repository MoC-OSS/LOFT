# SonarCloud's default key for moc-global/loft-mono; the SonarCloud project key must match (Administration > Update Key)
sonar.projectKey=MoC-OSS_LOFT
sonar.organization=MoC-OSS

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectVersion=1.0

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Tests sit next to the code, so the same tree is split into sources and tests.
# docs/ holds Markdown and the standalone interactive page (docs/interactive/index.html), which are not shipped code
sonar.sources=.
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,docs/**
sonar.tests=.
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts

# Written by `pnpm test:unit:coverage` in the CI workflow
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Each example is a standalone project that users copy, so its database, setup and shutdown code repeats on purpose
sonar.cpd.exclusions=examples/**

# Unit coverage covers packages/*/src (see vitest.config.mts); leave out what it does not measure
sonar.coverage.exclusions=examples/**,integration/**,scripts/**,docs/**,packages/loft-test-suite/**,packages/loft-pglite/**,packages/*/bin/**,**/*.config.ts,**/*.config.mts,**/*.config.js,**/initTestBucket.js,**/.kanelrc.js
